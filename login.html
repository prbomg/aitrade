<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAIROS — Вход в терминал</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root {
  --bg: #090d16;
  --card: rgba(17, 24, 39, 0.88);
  --card-solid: #111827;
  --border: #24324d;
  --border-focus: #38bdf8;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --cyan: #38bdf8;
  --emerald: #34d399;
  --danger: #f87171;
}
* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background-color: var(--bg);
  color: var(--text);
  overflow-x: clip;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px 16px;
  position: relative;
  background-image:
    radial-gradient(circle at 18% 18%, rgba(56, 189, 248, 0.11), transparent 42%),
    radial-gradient(circle at 82% 84%, rgba(52, 211, 153, 0.09), transparent 44%),
    linear-gradient(rgba(36, 50, 77, 0.16) 1px, transparent 1px),
    linear-gradient(90deg, rgba(36, 50, 77, 0.16) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
}

.auth-shell {
  width: 100%;
  max-width: 416px;
  position: relative;
  z-index: 2;
}

.auth-card {
  background: var(--card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 28px 26px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(56, 189, 248, 0.06) inset;
  position: relative;
  overflow: hidden;
}
.auth-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 16%;
  right: 16%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #38bdf8, #34d399, transparent);
  opacity: 0.9;
}

.brand-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 24px;
}
.brand-home-link {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: inherit;
  transition: transform 0.18s ease, opacity 0.18s ease;
}
.brand-home-link:hover {
  transform: translateY(-1px);
  opacity: 0.95;
}
.brand-logo {
  width: 68px;
  height: 68px;
  filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.22));
}
.brand-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 0.26em;
  padding-left: 0.26em;
  color: #ffffff;
  margin: 0;
  line-height: 1.1;
}
.brand-subtitle {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 6px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 14px;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  color: #cbd5e1;
  background: rgba(15, 23, 42, 0.78);
  border: 1px solid rgba(56, 189, 248, 0.24);
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 8px rgba(52, 211, 153, 0.85);
}

.alert-box {
  display: none;
  margin-bottom: 16px;
  padding: 10px 12px;
  border-radius: 9px;
  font-size: 12.5px;
  line-height: 1.4;
}
.alert-box.show { display: block; }
.alert-error {
  background: rgba(239, 68, 68, 0.14);
  border: 1px solid rgba(239, 68, 68, 0.45);
  color: #fca5a5;
}
.alert-info {
  background: rgba(56, 189, 248, 0.12);
  border: 1px solid rgba(56, 189, 248, 0.35);
  color: #bae6fd;
}

.field {
  margin-bottom: 15px;
}
.field label {
  display: block;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--muted);
  margin-bottom: 6px;
}
.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.input-wrap input {
  width: 100%;
  background: #0b1220;
  color: #ffffff;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px 13px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input-wrap input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
}
.input-wrap.has-toggle input {
  padding-right: 42px;
}
.toggle-pw {
  position: absolute;
  right: 8px;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 6px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.toggle-pw:hover { color: #ffffff; }

.options-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 4px 0 20px;
  font-size: 12px;
  color: var(--muted);
}
.remember-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.remember-label input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: #38bdf8;
  cursor: pointer;
}

.btn-submit {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: #06101c;
  background: linear-gradient(135deg, #38bdf8 0%, #34d399 100%);
  cursor: pointer;
  transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
  box-shadow: 0 8px 24px rgba(56, 189, 248, 0.24);
}
.btn-submit:hover:not(:disabled) {
  filter: brightness(1.06);
  transform: translateY(-1px);
  box-shadow: 0 10px 28px rgba(52, 211, 153, 0.28);
}
.btn-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.auth-footer {
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid rgba(36, 50, 77, 0.7);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: #64748b;
  gap: 8px;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.shake { animation: shake 0.34s ease; }

@media (max-width: 420px) {
  .auth-card { padding: 26px 20px 22px; }
  .brand-title { font-size: 21px; }
}
</style>
</head>
<body>
<main class="auth-shell">
  <section class="auth-card" id="auth-card" aria-labelledby="login-title">
    <div class="brand-header">
      <a href="/" class="brand-home-link" title="KAIROS — На главную">
        <svg class="brand-logo" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="kairosLoginBeam" x1="14" y1="54" x2="51" y2="7" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#0ea5e9"/>
              <stop offset="45%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#34d399"/>
            </linearGradient>
          </defs>
          <path d="M 17.42 43.39 A 18.5 18.5 0 0 1 38.93 14.85" stroke="#ffffff" stroke-width="5.2" stroke-linecap="butt"/>
          <path d="M 46.17 20.11 A 18.5 18.5 0 0 1 26.90 49.78" stroke="#ffffff" stroke-width="5.2" stroke-linecap="butt"/>
          <polygon points="13,54 22.2,54 51.5,7.5" fill="url(#kairosLoginBeam)"/>
        </svg>
        <h1 class="brand-title" id="login-title">KAIROS</h1>
      </a>
      <div class="brand-subtitle">Quantitative Trading Terminal</div>
      <div class="status-pill" id="server-status-pill">
        <span class="status-dot"></span>
        <span id="server-status-text">Защищённый вход на сервер</span>
      </div>
    </div>

    <div class="alert-box alert-error" id="error-box" role="alert"></div>
    <div class="alert-box alert-info" id="info-box" role="status"></div>

    <form id="login-form" autocomplete="on" novalidate>
      <div class="field">
        <label for="username">Логин</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username" autocomplete="username" placeholder="Введите логин" required autofocus>
        </div>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <div class="input-wrap has-toggle">
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••••••" required>
          <button type="button" class="toggle-pw" id="btn-toggle-pw" title="Показать / скрыть пароль" aria-label="Показать пароль">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="options-row">
        <label class="remember-label">
          <input type="checkbox" id="remember-me" checked>
          <span>Запомнить сессию (7 дней)</span>
        </label>
        <span style="font-variant-numeric:tabular-nums">Bybit V5</span>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">Войти в терминал →</button>
    </form>

    <div class="auth-footer">
      <span>KAIROS Control Node</span>
      <span id="version-label">Protected Session</span>
    </div>
  </section>
</main>

<script>
(function() {
  const form = document.getElementById("login-form");
  const card = document.getElementById("auth-card");
  const errBox = document.getElementById("error-box");
  const infoBox = document.getElementById("info-box");
  const btnSubmit = document.getElementById("btn-submit");
  const pwInput = document.getElementById("password");
  const btnTogglePw = document.getElementById("btn-toggle-pw");
  const params = new URLSearchParams(window.location.search);
  const nextUrl = (params.get("next") || "/").startsWith("/") && !(params.get("next") || "").startsWith("//")
    ? (params.get("next") || "/")
    : "/";

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add("show");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }
  function hideError() {
    errBox.classList.remove("show");
  }

  btnTogglePw.addEventListener("click", function() {
    const isPw = pwInput.type === "password";
    pwInput.type = isPw ? "text" : "password";
    btnTogglePw.setAttribute("aria-label", isPw ? "Скрыть пароль" : "Показать пароль");
  });

  fetch("/api/auth/status", { credentials: "same-origin" })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(st) {
      if (!st) return;
      if (st.version) document.getElementById("version-label").textContent = "v" + st.version;
      if (!st.auth_enabled) {
        infoBox.innerHTML = "Авторизация на сервере пока не активирована (задайте <code>KAIROS_AUTH_USER</code> и <code>KAIROS_AUTH_PASSWORD</code> в <code>.env</code>). <a href=\"/\" style=\"color:#38bdf8;font-weight:600\">Открыть терминал →</a>";
        infoBox.classList.add("show");
      } else if (st.authenticated) {
        window.location.replace(nextUrl);
      }
    })
    .catch(function() {});

  form.addEventListener("submit", async function(e) {
    e.preventDefault();
    hideError();
    const username = document.getElementById("username").value.trim();
    const password = pwInput.value;
    const remember = document.getElementById("remember-me").checked;
    if (!username || !password) {
      showError("Укажите логин и пароль.");
      return;
    }
    btnSubmit.disabled = true;
    btnSubmit.textContent = "Проверка доступа...";
    try {
      const resp = await fetch("/api/auth/login", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-Requested-With": "AItrade"
        },
        body: JSON.stringify({ username: username, password: password, remember: remember, next: nextUrl })
      });
      const data = await resp.json().catch(function() { return {}; });
      if (!resp.ok || !data.ok) {
        showError(data.retMsg || "Неверный логин или пароль.");
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Войти в терминал →";
        pwInput.select();
        return;
      }
      btnSubmit.textContent = "Доступ разрешён...";
      window.location.replace(data.redirect || nextUrl);
    } catch (err) {
      showError("Ошибка соединения с сервером. Повторите попытку.");
      btnSubmit.disabled = false;
      btnSubmit.textContent = "Войти в терминал →";
    }
  });
})();
</script>
</body>
</html>
